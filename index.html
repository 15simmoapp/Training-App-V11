<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7f8f6"><title>Matthew's Training App V11</title><link rel="stylesheet" href="style.css"><script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js" defer></script></head><body>
<header><div><small>MATTHEW'S</small><h1>Training App</h1></div><div><button id="themeBtn">◐</button><button id="timerBtn">⏱</button></div></header>
<main><section id="home" class="screen active"></section><section id="train" class="screen"></section><section id="workout" class="screen"></section><section id="progress" class="screen"></section><section id="quests" class="screen"></section><section id="mobility" class="screen"></section><section id="more" class="screen"></section></main>
<nav><button data-screen="home" class="active">⌂<span>Home</span></button><button data-screen="train">▣<span>Train</span></button><button data-screen="progress">↗<span>Progress</span></button><button data-screen="quests">◇<span>Quests</span></button><button data-screen="more">⋯<span>More</span></button></nav>
<dialog id="timerDialog"><div class="modal"><div class="between"><h2 id="timerTitle">Rest timer</h2><button onclick="timerDialog.close()">×</button></div><div id="clock">01:30</div><div class="quick"><button data-time="60">1:00</button><button data-time="90">1:30</button><button data-time="120">2:00</button><button data-time="180">3:00</button></div><button id="timerToggle" class="primary full">Start</button></div></dialog>
<dialog id="tapDialog"><div class="modal"><h2>Tap out safely</h2><p class="muted">Logged work is retained. This session is recorded as stopped, not failed.</p><label>Reason<select id="tapReason"><option>Pain / possible injury</option><option>Feeling unwell / dizzy</option><option>Equipment / environment issue</option><option>Time constraint</option><option>Other</option></select></label><label>Note<textarea id="tapNote"></textarea></label><button id="tapConfirm" class="danger full">Stop session</button></div></dialog>
<div id="toast"></div><script src="app.js"></script></body></html>
